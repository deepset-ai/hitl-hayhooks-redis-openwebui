services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - hitl-network
    restart: unless-stopped

  hayhooks:
    build: . # Build from local Dockerfile
    container_name: hayhooks
    ports:
      - "1416:1416"
    volumes:
      - ./pipelines:/pipelines
    environment:
      - HAYHOOKS_PIPELINES_DIR=/pipelines
      # Note that this is the REAL OPENAI_API_KEY key
      # which you should have in your environment variables.
      # It will be used by hayhooks in hitl pipeline
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Redis connection (uses container name)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Anonymous feedback tool - defaults to DEMO_MODE=true (simulates posting, no real
      # webhook needed). Set DEMO_MODE=false and fill in SLACK_WEBHOOK_URL to actually post.
      - DEMO_MODE=${DEMO_MODE-false}
      - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/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
    depends_on:
      - redis
    networks:
      - hitl-network
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      WEBUI_AUTH: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "false"
      OFFLINE_MODE: "true"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      DEFAULT_PROMPT_SUGGESTIONS: |-
        [
          {
            "title": ["What's new today?"],
            "content": "What's new today in Haystack 3.0 Launch Week?"
          },
          {
            "title": ["Explain a feature"],
            "content": "What are Agent hooks in Haystack 3.0?"
          },
          {
            "title": ["Recap a launch day"],
            "content": "What happened on day 3 of launch week?"
          },
          {
            "title": ["Find a repo"],
            "content": "What repo should I look at for human-in-the-loop patterns?"
          },
          {
            "title": ["Search the docs"],
            "content": "How do I write a custom Haystack component?"
          },
          {
            "title": ["Send feedback"],
            "content": "Tell the deepset team I love the human-in-the-loop hooks"
          }
        ]
    depends_on:
      - hayhooks
      - redis
    networks:
      - hitl-network
    restart: unless-stopped

networks:
  hitl-network:
    driver: bridge

volumes:
  open-webui:
